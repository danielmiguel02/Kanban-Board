<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0" style="max-width:450px; width:100%;">

        <div class="card-body p-4">

            <h2 class="text-center mb-4">
                Kanban Board
            </h2>

            <!-- Navigation -->
            <ul class="nav nav-pills nav-fill mb-4" id="authTabs">

                <li class="nav-item">
                    <button
                        class="nav-link active"
                        id="loginTab">
                        Login
                    </button>
                </li>

                <li class="nav-item">
                    <button
                        class="nav-link"
                        id="registerTab">
                        Register
                    </button>
                </li>

            </ul>

            <!-- LOGIN -->

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Login

                </button>

            </form>

            <!-- REGISTER -->

            <form
                id="registerForm"
                class="d-none">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registername"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100">

                    Create Account

                </button>

            </form>

            <div
                id="message"
                class="mt-3 text-center">
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
