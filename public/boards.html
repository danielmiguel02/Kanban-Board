<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Boards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- NEW CSS -->
    <link href="css/boards.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">

        <span class="navbar-brand fw-bold">
            Kanban Board
        </span>

        <div class="d-flex align-items-center">

            <span class="text-white me-3" id="name"></span>

            <button id="logoutBtn" class="btn btn-outline-light btn-sm">
                Logout
            </button>

        </div>

    </div>
</nav>

<!-- MAIN -->
<div class="container py-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Your Boards</h2>

        <button class="btn btn-primary" id="createBoardBtn">
            + New Board
        </button>
    </div>

    <!-- OWNED BOARDS -->
    <div id="ownedBoards" class="row g-3 mb-5"></div>

    <!-- SHARED -->
    <h2 class="mb-3">Shared With You</h2>

    <div id="sharedBoards" class="row g-3"></div>

</div>

<!-- CREATE BOARD MODAL -->
<div class="modal fade" id="createBoardModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Create Board</h5>

                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <label class="form-label">Board Name</label>
                <input id="boardName" class="form-control" />

                <label class="form-label mt-3">Board Color</label>

                <select id="boardColor" class="form-select">
                    <option value="#2563eb">Blue</option>
                    <option value="#374151">Gray</option>
                    <option value="#991b1b">Red</option>
                    <option value="#065f46">Green</option>
                    <option value="#7c3aed">Purple</option>
                </select>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-primary" id="saveBoardBtn">
                    Create
                </button>

            </div>

        </div>

    </div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script defer src="boards.js"></script>

</body>
</html>
