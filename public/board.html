<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Kanban Board</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Board CSS -->
    <link
        href="css/board.css"
        rel="stylesheet">

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-dark shadow-sm">

    <div class="container-fluid px-4">

        <a
            href="boards.html"
            class="navbar-brand fw-bold">

            ← Boards

        </a>

        <div class="d-flex align-items-center gap-3">

            <h5
                id="boardName"
                class="text-white m-0 fw-semibold">
            </h5>

            <button
                id="editBoardBtn"
                class="btn btn-link text-white p-0 board-action d-none"
                title="Edit Board">

                ✏️

            </button>

            <!-- Future -->
            <!--
            <button
                id="memberBtn"
                class="btn btn-link text-white p-0 board-action d-none">

                👤

            </button>
            -->

        </div>

        <button
            id="logoutBtn"
            class="btn btn-outline-light">

            Logout

        </button>

    </div>

</nav>

<!-- =========================
     BOARD
========================= -->

<div class="board-page">

    <!-- HEADER -->

    <div class="board-header">

        <h2 class="board-title">
            Columns
        </h2>

        <button
            id="addColumnBtn"
            class="btn btn-primary">

            + Add Column

        </button>

    </div>

    <!-- COLUMNS -->

    <div
        id="columnsContainer"
        class="columns-wrapper">

        <!-- Columns injected here -->

    </div>

</div>

<!-- =========================
     ADD COLUMN MODAL
========================= -->

<div
    class="modal fade"
    id="addColumnModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    New Column

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <label class="form-label">

                    Column Name

                </label>

                <input
                    id="columnNameInput"
                    class="form-control"
                    autocomplete="off">

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    id="saveColumnBtn"
                    class="btn btn-primary">

                    Create

                </button>

            </div>

        </div>

    </div>

</div>

<!-- =========================
     ADD CARD MODAL
========================= -->

<div
    class="modal fade"
    id="addCardModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    New Card

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <label class="form-label">

                    Card Title

                </label>

                <input
                    id="cardTitleInput"
                    class="form-control"
                    autocomplete="off">

                <input
                    type="hidden"
                    id="activeColumnId">

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    id="saveCardBtn"
                    class="btn btn-primary">

                    Create Card

                </button>

            </div>

        </div>

    </div>

</div>

<!-- =========================
     EDIT BOARD MODAL
========================= -->

<div
    class="modal fade"
    id="editBoardModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Board
                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <label class="form-label">
                    Board Name
                </label>

                <input
                    id="editBoardName"
                    class="form-control">

                <label class="form-label mt-3">
                    Board Theme
                </label>

                <select
                    id="editBoardColor"
                    class="form-select">

                    <option value="#f4f6fb">Light</option>
                    <option value="#374151">Slate</option>
                    <option value="#2563eb">Ocean</option>
                    <option value="#7c3aed">Purple</option>
                    <option value="#991b1b">Rose</option>

                </select>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    id="saveBoardChangesBtn"
                    class="btn btn-primary">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Board JS -->

<script src="board.js"></script>

</body>
</html>
