<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">

        <a href="/boards.html" class="navbar-brand fw-bold">
            ← Boards
        </a>

        <span id="boardName" class="text-white fw-semibold"></span>

        <button id="logoutBtn" class="btn btn-outline-light btn-sm">
            Logout
        </button>

    </div>
</nav>

<!-- BOARD CONTAINER -->
<div class="container-fluid px-5 py-4">

    <!-- BOARD HEADER ACTIONS -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <h4 class="mb-0">Columns</h4>

        <button class="btn btn-primary btn-sm" id="addColumnBtn">
            + Add Column
        </button>

    </div>

    <!-- COLUMNS WRAPPER -->
    <div id="columnsContainer" class="columns-wrapper d-flex gap-3 overflow-auto pb-3">

        <!-- Columns will be injected here -->

    </div>

</div>

<!-- =========================
     ADD COLUMN MODAL
========================= -->
<div class="modal fade" id="addColumnModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add Column</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <label class="form-label">Column Name</label>
                <input id="columnNameInput" class="form-control" />

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-primary" id="saveColumnBtn">
                    Create
                </button>

            </div>

        </div>

    </div>

</div>

<!-- =========================
     ADD CARD MODAL
========================= -->
<div class="modal fade" id="addCardModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add Card</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <label class="form-label">Card Title</label>
                <input id="cardTitleInput" class="form-control" />

                <input type="hidden" id="activeColumnId" />

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-primary" id="saveCardBtn">
                    Create
                </button>

            </div>

        </div>

    </div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="board.js"></script>

</body>
</html>
